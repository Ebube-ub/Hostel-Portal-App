<div class="table-container">
    <table class="admin-table">
        <thead>
            <tr>
                <th>User Email</th>
                <th>Room</th>
                <th>Check-In</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for booking in bookings %}
            <tr>
                <td>{{ booking.current_occupant_email }}</td>
                <td>{{ booking.room_name }}</td>
                <td>{{ booking.check_in.strftime('%Y-%m-%d %H:%M') }}</td>
                <td>
                    <span class="badge badge-{{ booking.status }}">
                        {{ booking.status|title }}
                    </span>
                </td>
                <td>
                    {% if booking.status == 'active' %}
                    <form method="POST" action="{{ url_for('cancel_booking_admin', booking_id=booking.id) }}" class="inline-form">
                        <button type="submit" class="btn-sm btn-danger" onclick="return confirm('Cancel this booking?')">
                            Cancel
                        </button>
                    </form>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
